<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>

<title>Login | Devi Collections</title>

                "on-primary": "#ffffff",
                "inverse-on-surface": "#f4f0ef",
                "on-surface": "#1c1b1b",
                "surface-tint": "#5d5f5f",
                "surface-dim": "#ddd9d9",
                "on-secondary-container": "#626566",
                "surface-container-highest": "#e5e2e1",
                "error": "#ba1a1a",
                "outline": "#747878",
                "surface-variant": "#e5e2e1",

                "on-tertiary-fixed": "#1a1c1c",
                "on-error-container": "#93000a",
                "surface-container": "#f1edec",
                "primary-fixed": "#e2e2e2",
                "on-primary-fixed-variant": "#454747",
                "surface-container-low": "#f6f3f2",
                "surface": "#ffffff",
                "secondary-fixed": "#e1e3e4",
                "secondary": "#5c5f60",
                "primary-container": "#ffffff",
                "outline-variant": "#E2E8F0", /* Matching the prompt's border requirement */
                "on-primary-container": "#747676",
                "secondary-fixed-dim": "#c5c7c8",
                "inverse-surface": "#313030",
                "on-tertiary-container": "#747676",
                "primary-fixed-dim": "#c6c6c7",
                "on-secondary-fixed": "#191c1d",
                "surface-container-lowest": "#ffffff",
                "surface-container-high": "#ebe7e7",

            "borderRadius": {

                "label-md": ["14px", {"lineHeight": "1.2", "letterSpacing": "0.05em", "fontWeight": "600"}]
            }
          },
        },
      }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #F8F9FA;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
            font-size: 20px;
        }
        .login-card {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.07);
        }
        input:focus {
            outline: none;
            border-color: #1A365D !important;
            ring: none;
        }
        /* Custom strike-through for out of stock / logic transitions */
        .out-of-stock {
            position: relative;
        }
        .out-of-stock::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 1px;
            background: #E2E8F0;
            transform: rotate(-45deg);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-md">
<!-- Login Container -->
<div class="w-full max-w-[440px]">
<!-- Brand Header (Simplified TopNavBar context) -->
<div class="flex justify-center mb-xl">
<span class="font-display-md text-display-md font-bold tracking-tighter text-on-background">DEVI</span>
</div>
<!-- Main Login Card -->
<div class="bg-surface border border-outline-variant login-card p-xl flex flex-col gap-lg">
<div class="flex flex-col gap-xs">
<h1 class="font-headline-lg text-headline-lg text-on-background">Welcome back</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Access your enterprise dashboard</p>
</div>
<!-- Social Login -->
<button class="w-full flex items-center justify-center gap-sm py-md border border-outline-variant font-label-md text-label-md text-on-surface hover:bg-surface-container-low transition-colors duration-200">
<svg height="18" viewbox="0 0 18 18" width="18">
<path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z" fill="#4285F4"></path>
<path d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z" fill="#34A853"></path>
<path d="M3.964 10.712c-.18-.54-.282-1.117-.282-1.712s.102-1.172.282-1.712V4.956H.957a8.991 8.991 0 0 0 0 8.088l3.007-2.332z" fill="#FBBC05"></path>
<path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.582C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.956L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z" fill="#EA4335"></path>
</svg>
                Continue with Google
            </button>
<div class="relative flex items-center py-sm">
<div class="flex-grow border-t border-outline-variant"></div>
<span class="flex-shrink mx-md font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest">Or login with</span>
<div class="flex-grow border-t border-outline-variant"></div>
</div>
<!-- Login Form -->
<form class="flex flex-col gap-lg" id="loginForm" novalidate="">
<!-- Method Toggle -->
<div class="flex border border-outline-variant p-[2px]">
<button class="flex-1 py-xs font-label-md text-label-md transition-all duration-200 bg-primary text-on-primary" id="toggleEmail" type="button">Email</button>
<button class="flex-1 py-xs font-label-md text-label-md transition-all duration-200 text-on-surface-variant hover:bg-surface-container-low" id="toggleMobile" type="button">Mobile</button>
</div>
<!-- Input Fields Wrapper -->
<div class="flex flex-col gap-md">
<!-- Email Field -->
<div class="flex flex-col gap-xs" id="emailContainer">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider" for="email">Email Address</label>
<input class="w-full border border-outline-variant bg-surface px-md py-sm font-body-md text-body-md text-on-surface focus:border-primary transition-colors" id="email" placeholder="e.g. admin@devi.com" type="email"/>
<span class="font-label-sm text-label-sm text-error hidden" id="emailError">Please enter a valid email address.</span>
</div>
<!-- Mobile Field (Hidden by Default) -->
<div class="hidden flex flex-col gap-xs" id="mobileContainer">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider" for="mobile">Mobile Number</label>
<div class="flex border border-outline-variant focus-within:border-primary transition-colors">
<span class="px-md py-sm bg-surface-container-low font-body-md text-body-md text-on-surface-variant border-r border-outline-variant">+91</span>
<input class="w-full border-none bg-surface px-md py-sm font-body-md text-body-md text-on-surface focus:ring-0" id="mobile" placeholder="98765 43210" type="tel"/>
</div>
<span class="font-label-sm text-label-sm text-error hidden" id="mobileError">Please enter a valid 10-digit number.</span>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-xs" id="passwordContainer">
<div class="flex justify-between items-center">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider" for="password">Password</label>
<a class="font-label-sm text-label-sm text-primary hover:underline underline-offset-4" href="#">Forgot Password?</a>
</div>
<div class="relative">
<input class="w-full border border-outline-variant bg-surface px-md py-sm font-body-md text-body-md text-on-surface focus:border-primary transition-colors pr-10" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-md top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-on-surface" id="passwordToggle" type="button">
<span class="material-symbols-outlined" id="eyeIcon">visibility</span>
</button>
</div>
<span class="font-label-sm text-label-sm text-error hidden" id="passwordError">Password is required.</span>
</div>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary py-md font-label-md text-label-md text-on-primary uppercase tracking-widest hover:bg-on-background transition-all duration-300 active:scale-[0.98]" id="submitBtn" type="submit">
                    Sign In
                </button>
</form>
<!-- Sign Up Footer -->
<div class="mt-md text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                    Don't have an account? <a class="text-on-background font-semibold hover:underline underline-offset-4" href="#">Contact Sales</a>
</p>
</div>
</div>
<!-- Footer Policy Links -->
<div class="mt-xl flex justify-center gap-lg font-label-sm text-label-sm text-on-surface-variant">
<a class="hover:text-on-background transition-colors" href="#">Privacy Policy</a>
<a class="hover:text-on-background transition-colors" href="#">Terms of Service</a>
<a class="hover:text-on-background transition-colors" href="#">Help Center</a>
</div>
</div>
<script>
        // DOM Elements
        const toggleEmail = document.getElementById('toggleEmail');
        const toggleMobile = document.getElementById('toggleMobile');
        const emailContainer = document.getElementById('emailContainer');
        const mobileContainer = document.getElementById('mobileContainer');
        const passwordContainer = document.getElementById('passwordContainer');
        const passwordField = document.getElementById('password');
        const passwordToggle = document.getElementById('passwordToggle');
        const eyeIcon = document.getElementById('eyeIcon');
        const submitBtn = document.getElementById('submitBtn');
        const loginForm = document.getElementById('loginForm');

        let currentMethod = 'email';

        // Toggle Logic
        toggleEmail.addEventListener('click', () => {
            currentMethod = 'email';
            emailContainer.classList.remove('hidden');
            mobileContainer.classList.add('hidden');
            passwordContainer.classList.remove('hidden');
            submitBtn.textContent = 'Sign In';
            
            toggleEmail.classList.add('bg-primary', 'text-on-primary');
            toggleEmail.classList.remove('text-on-surface-variant', 'hover:bg-surface-container-low');
            toggleMobile.classList.remove('bg-primary', 'text-on-primary');
            toggleMobile.classList.add('text-on-surface-variant', 'hover:bg-surface-container-low');
        });

        toggleMobile.addEventListener('click', () => {
            currentMethod = 'mobile';
            emailContainer.classList.add('hidden');
            mobileContainer.classList.remove('hidden');
            passwordContainer.classList.add('hidden');
            submitBtn.textContent = 'Get OTP';

            toggleMobile.classList.add('bg-primary', 'text-on-primary');
            toggleMobile.classList.remove('text-on-surface-variant', 'hover:bg-surface-container-low');
            toggleEmail.classList.remove('bg-primary', 'text-on-primary');
            toggleEmail.classList.add('text-on-surface-variant', 'hover:bg-surface-container-low');
        });

        // Password Toggle
        passwordToggle.addEventListener('click', () => {
            const isPassword = passwordField.type === 'password';
            passwordField.type = isPassword ? 'text' : 'password';
            eyeIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
        });

        // Validation Logic
        const validateEmail = (email) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
        const validateMobile = (mobile) => /^\d{10}$/.test(mobile.replace(/\s/g, ''));

        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            let isValid = true;

            // Reset errors
            document.getElementById('emailError').classList.add('hidden');
            document.getElementById('mobileError').classList.add('hidden');
            document.getElementById('passwordError').classList.add('hidden');

            if (currentMethod === 'email') {
                const emailVal = document.getElementById('email').value;
                const passVal = document.getElementById('password').value;

                if (!validateEmail(emailVal)) {
                    document.getElementById('emailError').classList.remove('hidden');
                    isValid = false;
                }
                if (passVal.length < 1) {
                    document.getElementById('passwordError').classList.remove('hidden');
                    isValid = false;
                }
            } else {
                const mobileVal = document.getElementById('mobile').value;
                if (!validateMobile(mobileVal)) {
                    document.getElementById('mobileError').classList.remove('hidden');
                    isValid = false;
                }
            }

            if (isValid) {
                submitBtn.innerHTML = '<span class="flex items-center justify-center gap-xs">Processing...</span>';
                submitBtn.disabled = true;
                setTimeout(() => {
                    alert('Validated successfully. Processing ' + currentMethod + ' authentication.');
                    submitBtn.textContent = currentMethod === 'email' ? 'Sign In' : 'Get OTP';
                    submitBtn.disabled = false;
                }, 1500);
            }
        });

        // Live Formatting for Mobile
        document.getElementById('mobile').addEventListener('input', (e) => {
            let value = e.target.value.replace(/\D/g, '');
            if (value.length > 10) value = value.slice(0, 10);
            e.target.value = value;
        });
    </script>
</body></html>
