<script>
        // OTP Focus Management Logic
        const inputs = document.querySelectorAll('.otp-input');
        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (e.target.value.length > 1) {
                    e.target.value = e.target.value.slice(0, 1);
                }
                if (e.target.value && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !e.target.value && index > 0) {
                    inputs[index - 1].focus();
                }
            });
        });

        // Timer Logic
        let timeLeft = 119; // 1:59
        const countdownEl = document.getElementById('countdown');
        const resendBtn = document.getElementById('resend-link');

        const timer = setInterval(() => {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            
            countdownEl.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            
            if (timeLeft <= 0) {
                clearInterval(timer);
                countdownEl.textContent = "00:00";
                countdownEl.classList.add('text-error');
                resendBtn.disabled = false;
                resendBtn.classList.remove('text-outline', 'cursor-not-allowed');
                resendBtn.classList.add('text-brand-navy', 'hover:underline', 'cursor-pointer');
            }
            timeLeft--;
        }, 1000);

        // Resend Button Visual Feedback
        resendBtn.addEventListener('click', () => {
            if (!resendBtn.disabled) {
                alert('A new OTP has been sent to your email.');
                // Logic to reset timer could go here
            }
        });

        // Verify Button Logic
        document.getElementById('verify-btn').addEventListener('click', () => {
            const code = Array.from(inputs).map(i => i.value).join('');
            if (code.length === 6) {
                const btn = document.getElementById('verify-btn');
                btn.textContent = "Verifying...";
                btn.classList.add('opacity-50');
                setTimeout(() => {
                    alert('Verification Successful!');
                    btn.textContent = "Verify Account";
                    btn.classList.remove('opacity-50');
                }, 1500);
            } else {
                alert('Please enter all 6 digits.');
            }
        });
    </script>
